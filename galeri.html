
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dokumentasi Kegiatan - OSIS SMU DuMay</title>
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#007bff">

    <style>
        .galeri-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
            padding: 12px;
        }

        .galeri-card {
            overflow: hidden;
            border-radius: 12px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .galeri-card img {
            width: 100%;
            height: 145px;
            object-fit: cover;
            display: block;
        }

        .galeri-info {
            padding: 10px;
        }

        .galeri-info h3 {
            margin: 0 0 7px;
            font-size: 15px;
        }

        .galeri-info p {
            margin: 0 0 7px;
            font-size: 13px;
            color: #64748b;
        }

        .galeri-info small {
            color: #94a3b8;
            font-size: 11px;
        }
    </style>
</head>

<body>

    <header class="osis-header">
        <div class="header-top">
            <div class="logo-container">
                <img src="logo-osis.jpg" alt="Logo OSIS" class="logo-osis">
                <div class="brand-text">
                    <h1>Dokumentasi</h1>
                    <p>OSIS SMU DuMay</p>
                </div>
            </div>
        </div>

        <div class="header-hero">
            <h2>Galeri Kegiatan 📸</h2>
            <p>Kenangan dan dokumentasi kegiatan OSIS SMU DuMay.</p>
        </div>
    </header>

    <main>
        <div id="daftarGaleri" class="galeri-grid">
            <p style="text-align:center;padding:25px;grid-column:1/-1;">
                Memuat dokumentasi...
            </p>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span>🏠</span>
            <span>Beranda</span>
        </a>

        <a href="berita.html" class="nav-item">
            <span>📰</span>
            <span>Berita</span>
        </a>

        <a href="agenda.html" class="nav-item">
            <span>📅</span>
            <span>Agenda</span>
        </a>
    </nav>

    <script type="module" src="./galeri-public.js"></script>

</body>
</html>
