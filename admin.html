<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - OSIS SMU DuMay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <header class="osis-header">
        <div class="header-top">
            <div class="logo-container">
                <img src="logo-osis.jpg" alt="Logo OSIS" class="logo-osis">
                <div class="brand-text">
                    <h1>PANEL ADMIN</h1>
                    <p>Manajemen Sistem OSIS DuMay</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Menu Navigasi Bawah Tetap di Tempat (Profil/Admin Aktif) -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Beranda</span>
        </a>
        <a href="index.html#agenda" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="18" y2="10"></line></svg>
            <span>Agenda</span>
        </a>
        <a href="index.html#galeri" class="nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <span>Galeri</span>
        </a>
        <a href="admin.html" class="nav-item active">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profil</span>
        </a>
    </nav>

    <main>
        <div class="card">
            <h2>Tambah Pengumuman Baru</h2>
            <form onsubmit="alert('Fitur simulasi: Pengumuman berhasil disimpan!'); return false;">
                <label for="judul">Judul Pengumuman</label>
                <input type="text" id="judul" required placeholder="Masukkan judul...">

                <label for="konten">Isi Pengumuman</label>
                <textarea id="konten" rows="5" required placeholder="Tulis isi pengumuman..."></textarea>

                <button type="submit">Publish Pengumuman</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 OSIS SMU DuMay</p>
    </footer>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js');
            });
        }
    </script>
</body>
</html>
